name: Fetch Macro Economic Data

on:
  schedule:
    # 每天运行一次，北京时间早上8点
    - cron: '0 0 * * *'  # UTC时间，对应北京时间8点
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-data:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas py-mini-racer

      - name: Fetch data
        run: |
          python fetch_data.py
          ls -la data.json  # 验证文件存在
          head -c 200 data.json  # 显示文件前200个字符

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update macro economic data $(date +'%Y-%m-%d')"
            git pull --rebase origin master
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css script.js data-fetch.js data.json settings.html settings.js _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
